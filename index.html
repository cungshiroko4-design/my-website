<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Choices</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            height: 620px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(99, 102, 241, 0.2);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Header */
        .header {
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08);
        }

        .title {
            font-size: 1.25rem;
            color: #fbbf24;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            gap: 12px;
            font-size: 0.9rem;
        }

        .badge {
            background: rgba(30, 41, 59, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.05);
        }

        /* KHUNG CẢNH NỀN */
        .road-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1e293b;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 20% 75%;
        }

        .sky-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 66%;
            background: linear-gradient(
                to bottom, 
                #1d4ed8 0%, 
                #2563eb 25%, 
                #4f46e5 50%, 
                #7c3aed 70%, 
                #c026d3 88%, 
                #e11d48 100%
            );
            z-index: 0;
        }

        .ground-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 34%;
            background: #1e293b;
            border-top: 12px solid #15803d;
            z-index: 0;
        }

        .road-container.zoom-in-car {
            transform: scale(1.8) translateY(-10%);
        }

        .mountains-bg {
            position: absolute;
            top: 36%;
            width: 100%;
            height: 30%;
            background: 
                radial-gradient(circle at 18% 100%, #4c1d95 0%, transparent 50%),
                radial-gradient(circle at 55% 100%, #581c87 0%, transparent 55%),
                radial-gradient(circle at 85% 100%, #312e81 0%, transparent 50%);
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
        }

        .trees-bg {
            position: absolute;
            bottom: 32%;
            width: 200%;
            height: 100px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            pointer-events: none;
            z-index: 2;
        }

        .animate-road .trees-bg {
            animation: moveTrees 3s linear infinite;
        }

        @keyframes moveTrees {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .tree {
            position: relative;
            width: 50px;
            height: 65px;
            background: #16a34a;
            border-radius: 50% 50% 45% 45%;
            box-shadow: 
                inset -6px -5px 0 0 #15803d,
                -15px 8px 0 -4px #22c55e,
                15px 10px 0 -6px #16a34a;
            margin: 0 15px;
            flex-shrink: 0;
        }

        .tree::before {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 16px;
            background: #78350f;
            border-radius: 2px;
            z-index: -1;
        }

        .lane-line {
            position: absolute;
            top: 84%;
            width: 200%;
            height: 6px;
            border-top: 6px dashed #fef08a;
            transform: translateY(-50%);
            z-index: 3;
        }

        .animate-road .lane-line {
            animation: moveRoadLeft 0.5s linear infinite;
        }

        @keyframes moveRoadLeft {
            0% { transform: translateY(-50%) translateX(0); }
            100% { transform: translateY(-50%) translateX(-60px); }
        }

        /* XE VÀ CHIIKAWA */
        .car-container {
            width: 130px;
            height: 85px;
            position: absolute;
            left: 15%;
            top: calc(84% - 48px);
            z-index: 5;
            transition: all 0.3s ease;
        }

        .car-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }

        .car-container.drive {
            animation: bumpDrive 0.25s infinite alternate ease-in-out;
        }

        @keyframes bumpDrive {
            from { transform: translateY(0); }
            to { transform: translateY(-4px); }
        }

        .chiikawa {
            position: absolute;
            width: 80px;
            height: 80px;
            left: 5%;
            top: calc(84% - 42px);
            z-index: 6;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .chiikawa img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .chiikawa.hop-in {
            left: 18%;
            top: calc(84% - 70px);
            transform: scale(0.6);
            opacity: 0;
        }

        /* BIỂN BÁO DI CHUYỂN RESPONSIVE */
        .moving-sign {
            position: absolute;
            width: 90px;
            height: 90px;
            object-fit: contain;
            z-index: 8;
            top: calc(84% - 60px);
            right: -120px; /* Bắt đầu từ bên ngoài màn hình phía bên phải */
            transition: right 0.03s linear;
        }

        /* HIỆU ỨNG BIẾN HÌNH XE KỲ LÂN */
        .transform-flash {
            animation: unicornTransform 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes unicornTransform {
            0% { filter: brightness(1) drop-shadow(0 0 0px transparent); transform: scale(1); }
            50% { filter: brightness(3) drop-shadow(0 0 35px #ec4899); transform: scale(1.4) rotate(-8deg); }
            100% { filter: brightness(1.2) drop-shadow(0 0 20px #a855f7); transform: scale(1.1); }
        }

        /* MODAL BẢNG CÂU HỎI */
        .modal {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 20px 25px;
            border-top: 3px solid #f59e0b;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .question-title {
            color: #38bdf8;
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-option {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 11px 16px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-size: 0.92rem;
            transition: all 0.2s;
        }

        .btn-option:hover {
            background: #334155;
            border-color: #38bdf8;
            transform: translateX(4px);
        }

        .explanation {
            display: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .explanation.correct {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
        }

        .explanation.wrong {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .btn-next {
            background: #f59e0b;
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            align-self: flex-end;
            display: none;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        /* NÚT BẮT ĐẦU */
        .start-btn-box {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            text-align: center;
            width: 90%;
        }

        .btn-start {
            padding: 14px 36px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.5);
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="title">Safety Choices</div>
        <div class="stats">
            <div class="badge">Điểm GPLX: <span id="score-val" style="color:#22c55e; font-weight:bold;">12</span>/12</div>
            <div class="badge">Câu hỏi: <span id="progress-val">0</span>/10</div>
        </div>
    </div>

    <div class="road-container" id="road">
        <div class="sky-bg"></div>
        <div class="ground-bg"></div>
        <div class="mountains-bg"></div>
        <div class="trees-bg">
            <div class="tree"></div><div class="tree"></div><div class="tree"></div>
            <div class="tree"></div><div class="tree"></div><div class="tree"></div>
        </div>
        <div class="lane-line"></div>

        <!-- Chiikawa -->
        <div class="chiikawa" id="chiikawa">
            <img src="chikawa.png" id="chiikawa-img" alt="Chiikawa">
        </div>

        <!-- Khung Xe -->
        <div class="car-container" id="car-box">
            <img src="https://api.iconify.design/emojione-v1:automobile.svg" class="car-img" id="car-img" alt="Car">
        </div>

        <!-- Nút Bắt đầu -->
        <div class="start-btn-box" id="start-box">
            <h2 style="color:#fbbf24; margin-bottom: 15px; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">HÀNH TRÌNH AN TOÀN GIAO THÔNG</h2>
            <button class="btn-start" onclick="onStartGame()">🚗 Bắt đầu hành trình</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="question-title" id="q-text">Nội dung câu hỏi tình huống...</div>
        <div class="options-grid" id="options-box"></div>
        <div class="explanation" id="explain-box"></div>
        <button class="btn-next" id="btn-next" onclick="nextScenario()">Tiếp tục hành trình ➔</button>
    </div>

    <div class="overlay-screen" id="end-screen" style="display: none;">
        <h1 id="end-title" style="margin-bottom: 12px;">KẾT QUẢ CỦA BẠN</h1>
        <p id="end-desc" style="color: #94a3b8; max-width: 550px; line-height: 1.5; margin-bottom: 20px;"></p>
        <button class="btn-start" onclick="resetGame()"> Chơi lượt mới (10 câu ngẫu nhiên)</button>
    </div>
</div>

<script src="questions.js"></script>

<script>
    let activeQuestions = [];
    let currentIdx = 0;
    let score = 12;
    let animationInterval = null;
    let isBeltPhase = false;
    let askedQuestionIds = [];

    // Link ảnh mặc định
    const NORMAL_CAR_SRC = "https://api.iconify.design/emojione-v1:automobile.svg";
    const UNICORN_CAR_SRC = "https://api.iconify.design/fluent-emoji-flat:unicorn.svg"; 

    const road = document.getElementById('road');
    const carBox = document.getElementById('car-box');
    const carImg = document.getElementById('car-img');
    const chiikawa = document.getElementById('chiikawa');
    const startBox = document.getElementById('start-box');
    const modal = document.getElementById('modal');
    const qText = document.getElementById('q-text');
    const optionsBox = document.getElementById('options-box');
    const explainBox = document.getElementById('explain-box');
    const btnNext = document.getElementById('btn-next');
    const scoreVal = document.getElementById('score-val');
    const progressVal = document.getElementById('progress-val');

    /* LỌC CÂU HỎI TRÁNH LẶP */
    function getUniqueQuestions(sourceArray, count) {
        let availableQuestions = sourceArray.filter((q, index) => {
            const qId = q.id !== undefined ? q.id : index;
            return !askedQuestionIds.includes(qId);
        });

        if (availableQuestions.length < count) {
            askedQuestionIds = [];
            availableQuestions = [...sourceArray];
        }

        const shuffled = [...availableQuestions].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, count);

        selected.forEach((q) => {
            const qId = q.id !== undefined ? q.id : sourceArray.indexOf(q);
            askedQuestionIds.push(qId);
        });

        return selected;
    }

    function onStartGame() {
        startBox.style.display = 'none';
        chiikawa.classList.add('hop-in');

        setTimeout(() => {
            startGameLogic();
        }, 600);
    }

    function startGameLogic() {
        activeQuestions = getUniqueQuestions(scenarios, 10);
        currentIdx = 0;
        score = 12;
        
        carImg.src = NORMAL_CAR_SRC;
        carBox.classList.remove('transform-flash');

        scoreVal.innerText = score;
        scoreVal.style.color = '#22c55e';
        progressVal.innerText = 0;
        
        runBeltPhase();
    }

    function resetGame() {
        document.getElementById('end-screen').style.display = 'none';
        chiikawa.classList.remove('hop-in');
        startBox.style.display = 'block';
    }

    /* GIAI ĐOẠN 1 */
    function runBeltPhase() {
        isBeltPhase = true;
        road.classList.remove('animate-road');
        carBox.classList.remove('drive');
        road.classList.add('zoom-in-car');

        explainBox.style.display = 'none';
        btnNext.style.display = 'none';

        qText.innerHTML = "<strong>GIAI ĐOẠN 1 - CHUẨN BỊ XUẤT PHÁT:</strong> Chiikawa vừa leo lên xe! Trước khi nhấn ga xuất phát, quy định bắt buộc đầu tiên bạn phải thực hiện là gì?";
        optionsBox.innerHTML = '';

        const beltOptions = [
            { text: "A. Đạp ga hết số phóng đi ngay!", correct: false },
            { text: "B. Nhắc Chiikawa cài dây an toàn & tự cài dây an toàn trước khi khởi động.", correct: true },
            { text: "C. Mở nhạc sôi động rồi chạy xe.", correct: false }
        ];

        beltOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt.text;
            btn.onclick = () => selectBeltOption(opt);
            optionsBox.appendChild(btn);
        });

        modal.style.display = 'flex';
    }

    function selectBeltOption(opt) {
        const buttons = optionsBox.querySelectorAll('.btn-option');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        explainBox.style.display = 'block';

        if (opt.correct) {
            explainBox.className = 'explanation correct';
            explainBox.innerHTML = `<strong>Tuyệt vời!</strong> Chiikawa và bạn đều đã cài dây an toàn. Nhấn nút bên dưới để xuất phát!`;
            
            btnNext.innerText = "Khởi động xe & Khởi hành! ➔";
            btnNext.style.background = "#22c55e";
            btnNext.style.color = "#fff";
            btnNext.style.display = 'block';
        } else {
            explainBox.className = 'explanation wrong';
            explainBox.innerHTML = `<strong>Chưa chính xác!</strong> Hãy đảm bảo an toàn bằng cách cài dây an toàn trước khi di chuyển nhé!`;
            
            setTimeout(() => {
                buttons.forEach(b => b.style.pointerEvents = 'auto');
            }, 1000);
        }
    }

    /* GIAI ĐOẠN 2 */
    function startMainJourney() {
        isBeltPhase = false;
        road.classList.remove('zoom-in-car');

        setTimeout(() => {
            runScenario();
        }, 600);
    }

    function runScenario(imageSrc = 'sign.png') {
        modal.style.display = 'none';
        explainBox.style.display = 'none';
        btnNext.style.display = 'none';
        
        const oldSign = document.querySelector('.moving-sign');
        if (oldSign) oldSign.remove();

        progressVal.innerText = currentIdx + 1;

        const sign = document.createElement('img');
        sign.src = imageSrc;
        sign.className = 'moving-sign';

        sign.onerror = function() {
            this.onerror = null;
            this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="%23f59e0b"><path d="M12 2L1 21h22L12 2zm0 3.5L20.5 19h-17L12 5.5zM11 10h2v4h-2zm0 5h2v2h-2z"/></svg>';
        };

        road.appendChild(sign);

        road.classList.add('animate-road');
        carBox.classList.add('drive');

        // TÍNH TOÁN VỊ TRÍ CHẠY DỰA THEO ĐỘ RỘNG MÀN HÌNH MÁY/ĐIỆN THOẠI
        const containerWidth = road.clientWidth;
        let rightPos = -120; // Xuất phát từ ngoài mép phải
        const targetStopPos = containerWidth * 0.55; // Vị trí dừng lại trước xe

        animationInterval = setInterval(() => {
            rightPos += (containerWidth * 0.015); // Tốc độ di chuyển tương thích độ phân giải
            sign.style.right = rightPos + 'px';

            if (rightPos >= targetStopPos) {
                clearInterval(animationInterval);
                stopAndShowQuestion();
            }
        }, 25);
    }

    function stopAndShowQuestion() {
        road.classList.remove('animate-road');
        carBox.classList.remove('drive');

        const data = activeQuestions[currentIdx];
        qText.innerText = data.question;
        optionsBox.innerHTML = '';

        data.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(opt, data.lawExplanation);
            optionsBox.appendChild(btn);
        });

        modal.style.display = 'flex';
    }

    function selectOption(selectedOpt, explanation) {
        const buttons = optionsBox.querySelectorAll('.btn-option');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        explainBox.style.display = 'block';

        if (selectedOpt.correct) {
            explainBox.className = 'explanation correct';
            explainBox.innerHTML = `<strong>Chính xác!</strong><br>${explanation}`;
        } else {
            explainBox.className = 'explanation wrong';
            score = Math.max(0, score - 3);
            scoreVal.innerText = score;
            if (score < 6) scoreVal.style.color = '#ef4444';
            
            explainBox.innerHTML = `<strong>Sai rồi (Trừ 3 điểm)!</strong><br>${explanation}`;
        }

        if (score === 0) {
            btnNext.innerText = "⛔ Bị tước GPLX! Xem kết quả ➔";
            btnNext.style.background = "#ef4444";
            btnNext.style.color = "#fff";
        } else {
            btnNext.innerText = "Tiếp tục hành trình ➔";
            btnNext.style.background = "#f59e0b";
            btnNext.style.color = "#0f172a";
        }

        btnNext.style.display = 'block';
    }

    function nextScenario() {
        if (isBeltPhase) {
            startMainJourney();
            return;
        }

        currentIdx++;
        if (currentIdx < activeQuestions.length && score > 0) {
            runScenario();
        } else {
            handleGameEnd();
        }
    }

    /* XỬ LÝ KẾT THÚC GAME & HÌNH ẢNH KỲ LÂN */
    function handleGameEnd() {
        modal.style.display = 'none';
        const oldSign = document.querySelector('.moving-sign');
        if (oldSign) oldSign.remove();

        // Nếu đạt tối đa 12 điểm -> Biến hình Kỳ lân trước rồi mới hiện popup
        if (score === 12) {
            carBox.classList.add('transform-flash');
            
            setTimeout(() => {
                carImg.src = UNICORN_CAR_SRC;
            }, 600);

            // Chờ xem xong hiệu ứng biến hình rồi hẳn bật màn hình kết thúc
            setTimeout(() => {
                showEndScreen();
            }, 1800);
        } else {
            showEndScreen();
        }
    }

    function showEndScreen() {
        const endScreen = document.getElementById('end-screen');
        const endTitle = document.getElementById('end-title');
        const endDesc = document.getElementById('end-desc');

        if (score === 0) {
            endTitle.innerText = "⛔ GAME OVER - BỊ TƯỚC GPLX!";
            endTitle.style.color = "#ef4444";
            endDesc.innerText = "Bạn đã vi phạm nhiều lỗi nghiêm trọng dẫn đến trừ hết điểm GPLX!";
        } else if (score === 12) {
            endTitle.innerText = "🦄 XUẤT SẮC - XE KỲ LÂN HUYỀN THOẠI!";
            endTitle.style.color = "#4ade80";
            endDesc.innerText = `Phi thường! Bạn đã trả lời đúng tuyệt đối 10/10 tình huống, bảo toàn 12/12 điểm GPLX và mở khóa thành công Xe Kỳ Lân 7 Màu!`;
        } else {
            endTitle.innerText = "⚠️ HOÀN THÀNH HÀNH TRÌNH!";
            endTitle.style.color = "#f59e0b";
            endDesc.innerText = `Bạn đã hoàn thành lượt đi và còn lại ${score}/12 điểm bằng lái.`;
        }

        endScreen.style.display = 'flex';
    }
</script>

</body>
</html>
